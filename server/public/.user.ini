; Upload limits for the proxy (media uploads are a few-MB JPEGs).
; PHP-FPM/CGI read this file from the docroot; PHP caches it for
; user_cache_ttl (default 5 min). On a mod_php host these are ignored — set the
; same values in php.ini or a hosting control-panel option instead.
upload_max_filesize = 20M
post_max_size = 25M
; NB: the PHP error log is configured in app.php (an absolute path needs the
; app root, which only the front controller knows).
