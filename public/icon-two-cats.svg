<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#FDFBF7"/>
  <!-- Left cat ears -->
  <polygon points="150,250 112,150 205,220" fill="#C9A96E"/>
  <polygon points="262,250 300,150 207,220" fill="#C9A96E"/>
  <!-- Right cat ears -->
  <polygon points="250,250 212,150 305,220" fill="#C9A96E"/>
  <polygon points="362,250 400,150 307,220" fill="#C9A96E"/>
  <!-- Left head -->
  <circle cx="206" cy="300" r="118" fill="#C9A96E"/>
  <!-- Right head -->
  <circle cx="306" cy="300" r="118" fill="#C9A96E"/>
  <!-- Left eyes -->
  <ellipse cx="166" cy="282" rx="16" ry="20" fill="#2D2D2D"/>
  <ellipse cx="246" cy="282" rx="16" ry="20" fill="#2D2D2D"/>
  <!-- Right eyes -->
  <ellipse cx="266" cy="282" rx="16" ry="20" fill="#2D2D2D"/>
  <ellipse cx="346" cy="282" rx="16" ry="20" fill="#2D2D2D"/>
  <!-- Eye shine -->
  <circle cx="172" cy="275" r="5" fill="#FDFBF7"/>
  <circle cx="252" cy="275" r="5" fill="#FDFBF7"/>
  <circle cx="272" cy="275" r="5" fill="#FDFBF7"/>
  <circle cx="352" cy="275" r="5" fill="#FDFBF7"/>
  <!-- Left nose -->
  <path d="M195,320 L217,320 L206,336 Z" fill="#2D2D2D"/>
  <!-- Right nose -->
  <path d="M295,320 L317,320 L306,336 Z" fill="#2D2D2D"/>
  <!-- Left whiskers -->
  <line x1="100" y1="315" x2="180" y2="322" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="332" x2="180" y2="332" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <!-- Right whiskers -->
  <line x1="332" y1="322" x2="412" y2="315" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <line x1="332" y1="332" x2="412" y2="332" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
</svg>
