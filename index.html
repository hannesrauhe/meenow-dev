<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- "default" adapts status-bar text to the theme-color metas below;
       "black-translucent" would force white text (unreadable on the light theme). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="meenow" />
  <meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1A17" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <!-- iOS does not accept SVG here; needs an opaque square PNG (iOS masks corners itself). -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>meenow — one spontaneous photo a day, shared with friends</title>
  <meta name="description" content="meenow prompts you once a day, at a random moment, to snap a dual-camera photo and share it with a small circle of friends. No feeds to scroll, no likes to chase — just a daily glimpse of each other." />

  <!-- Social share previews (messengers, Slack, Discord, Facebook, LinkedIn).
       Absolute URLs point at the production domain so scrapers resolve the image
       even when the same file is served from dev.meenow.de. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="meenow" />
  <meta property="og:title" content="meenow — one spontaneous photo a day, shared with friends" />
  <meta property="og:description" content="A once-a-day prompt to snap a dual-camera photo and share it with a small circle of friends. No endless feed, no likes — just a daily glimpse of each other." />
  <meta property="og:url" content="https://meenow.de/" />
  <meta property="og:image" content="https://meenow.de/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="meenow — one spontaneous photo a day, shared with friends" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="meenow — one spontaneous photo a day, shared with friends" />
  <meta name="twitter:description" content="A once-a-day prompt to snap a dual-camera photo and share it with a small circle of friends. No endless feed, no likes — just a daily glimpse of each other." />
  <meta name="twitter:image" content="https://meenow.de/og-image.png" />
</head>
<body>
  <div id="app" class="max-w-[480px] mx-auto"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
